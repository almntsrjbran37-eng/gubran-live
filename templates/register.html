<html lang="ar" dir="rtl">
<head>
<style>
    input { display: block; margin: 10px auto; padding: 10px; width: 250px; }
    button { background: green; color: white; border: none; padding: 10px 20px; cursor: pointer; }
</style>
</head>
<body>
    <h2>إنشاء حساب جديد</h2>
    <form method="POST">
        <input type="text" name="username" placeholder="اسم المستخدم" required>
        <input type="email" name="email" placeholder="البريد الإلكتروني" required>
        <input type="text" name="display_name" placeholder="اسم العرض" required>
        <input type="password" name="password" placeholder="كلمة المرور" required>
        <button type="submit">تسجيل</button>
    </form>
</body>
</html>
